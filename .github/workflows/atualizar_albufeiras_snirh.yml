# Água guardada em cada albufeira hidroelétrica, dia a dia (SNIRH, Agência Portuguesa do Ambiente).
#
# scripts/atualizar_albufeiras_snirh.py
#   -> data/producao/albufeiras_snirh_diario.csv   (uma coluna por albufeira, hm3)
#   -> data/producao/albufeiras_snirh.csv          (as 40 albufeiras: bacia, capacidade, referência)
#
# Não precisa de chave. O SNIRH publica o valor de cada dia na manhã seguinte e às vezes revê-o:
# cada corrida pede os últimos 30 dias de cada albufeira (40 pedidos, ~35 s).
#
# A primeira vez: correr à mão com backfill=true, que traz a série desde 2001 (~1 min).
#
# O nome não pode ter * ? + [ ] ! : é alvo do workflow_run do gerar_hoje.yml,
# que refaz o manifesto depois de cada corrida.

name: Atualizar Albufeiras (SNIRH)

on:
  schedule:
    - cron: '40 8,20 * * *'

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Reconstruir tudo desde 2001'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo próprio: só impede que este workflow se sobreponha a si mesmo; as corridas
# contra os outros bots resolvem-se no retry+rebase da commit-with-retry.
concurrency:
  group: commits-albufeiras-snirh
  cancel-in-progress: false

jobs:
  atualizar-albufeiras-snirh:
    name: Recolher o volume de cada albufeira
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Só a biblioteca padrão: não há dependências a instalar

      - name: Atualizar albufeiras
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scripts/atualizar_albufeiras_snirh.py --backfill
          else
            python scripts/atualizar_albufeiras_snirh.py
          fi

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar albufeiras (SNIRH)"
          file_pattern: "data/producao/albufeiras_snirh_diario.csv data/producao/albufeiras_snirh.csv"
