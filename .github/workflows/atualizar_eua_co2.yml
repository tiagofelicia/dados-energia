# Publica os resultados dos leilões primários de licenças de CO2 da UE (EU ETS).
#
# atualizar_eua_co2.py
#   → data/emissoes/eua_co2.csv   (um leilão por linha, desde 07/01/2020)
#
# Porquê um workflow separado do gerar_agregados.yml, apesar de escrever na
# mesma pasta: este recolhe de uma fonte externa (EEX) e aquele deriva de dados
# que já cá estão. Misturá-los faria uma falha de rede da EEX parar o cálculo da
# intensidade carbónica, que não depende dela.
#
# Não toca no data/emissoes/metadata.json — esse é do gerar_intensidade_carbonica.py.
#
# Não precisa de secrets: a fonte é pública.

name: Atualizar CO2 (EU ETS)

on:
  schedule:
    # 14:10 UTC — os leilões fecham às 11:00 CET, o que dá margem larga para o
    # relatório da EEX estar publicado. Um por dia chega: há no máximo um leilão
    # por dia útil, e a tolerância declarada no manifesto é de 5 dias.
    - cron: '10 14 * * *'

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Reconstruir a série completa desde 2020'
        type: boolean
        required: false
        default: false

# Antecipar o default Node24 (silencia o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo próprio: as corridas contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry. Este grupo só serve para o workflow não se
# sobrepor a si mesmo.
concurrency:
  group: commits-eua
  cancel-in-progress: false

jobs:
  atualizar-eua:
    name: Recolher leilões de CO2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache das dependências Python
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar leilões de CO2
        run: |
          # set -o pipefail: sem isto o exit code passa a ser o do tee e uma
          # falha do script daria um step verde.
          set -o pipefail
          mkdir -p logs
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            ARGS="--backfill"
          fi
          python scripts/atualizar_eua_co2.py $ARGS 2>&1 | tee logs/eua_co2.log

      # O script não reescreve o ficheiro quando nada mudou, por isso a action
      # não deteta alterações e não commita — nenhum commit vazio.
      - name: Fazer commit do dataset (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "🏭 BOT: Atualizar leilões de CO2 (EU ETS)"
          file_pattern: "data/emissoes/eua_co2.csv"

      - name: Fazer upload do log como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-eua-co2
          path: logs/eua_co2.log
          retention-days: 30
