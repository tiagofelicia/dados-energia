# O «Balanço Hidráulico» diário da REN (Data Hub → Eletricidade → Balanço Diário,
# modelo 1535): energia afluente às albufeiras, aos fios de água e às mini-hídricas,
# a produção de cada um, a bombagem, a energia guardada nas albufeiras (GWh e %),
# a variação do dia e os descarregamentos, desde 01/01/2010.
#
# scripts/atualizar_balanco_hidraulico_ren.py
#   -> data/producao/balanco_hidraulico_ren.csv
#
# A REN publica o dia anterior durante a manhã e revê os valores semanas depois:
# cada corrida volta a pedir os últimos 14 dias (e os que faltarem); a de domingo,
# os últimos 365. O script só reescreve o ficheiro quando alguma coisa muda.
# Sem ficheiro (a 1.ª corrida), traz a série inteira desde 2010: ~6 200 pedidos,
# um por dia.
#
# Não precisa de secrets, e o datahub.ren.pt aceita ligações dos runners do GitHub
# (ao contrário da API dos ERC, ver o gerar_hoje.yml).
#
# O nome não pode ter * ? + [ ] ! : é alvo do workflow_run do gerar_hoje.yml,
# que refaz o manifesto depois de cada corrida.

name: Atualizar Balanço Hidráulico (REN)

on:
  schedule:
    # 3 vezes por dia: a REN publica o dia anterior de manhã, a hora varia
    - cron: '40 8,14,20 * * *'
    # domingo, 05:50 UTC: revisão dos últimos 365 dias
    - cron: '50 5 * * 0'

  workflow_dispatch:
    inputs:
      revisao:
        description: 'Revisão: voltar a pedir à REN os últimos 365 dias'
        type: boolean
        default: false
      desde:
        description: 'Voltar a pedir tudo desde esta data (AAAA-MM-DD; vazio = não)'
        type: string
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo próprio: só impede que este workflow se sobreponha a si mesmo; as corridas
# contra os outros bots resolvem-se no retry+rebase da commit-with-retry.
concurrency:
  group: commits-balanco-hidraulico
  cancel-in-progress: false

jobs:
  atualizar-balanco-hidraulico:
    name: Recolher o balanço hidráulico da REN
    runs-on: ubuntu-26.04
    # A 1.ª corrida (a série desde 2010) é a mais longa; as outras levam segundos
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        # requests para a REN; tzdata garante o zoneinfo em qualquer runner
        run: python -m pip install --upgrade pip requests tzdata

      - name: Atualizar o balanço hidráulico
        # As entradas passam por env (e não por ${{ }} dentro do script) para não
        # poderem injetar comandos; o script valida a data.
        env:
          DESDE: ${{ github.event.inputs.desde }}
          REVISAO: ${{ github.event.inputs.revisao }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mkdir -p logs
          if [ -n "$DESDE" ]; then
            python scripts/atualizar_balanco_hidraulico_ren.py --desde "$DESDE" 2>&1 | tee logs/balanco_hidraulico.log
          elif [ "$AGENDA" = "50 5 * * 0" ] || [ "$REVISAO" = "true" ]; then
            python scripts/atualizar_balanco_hidraulico_ren.py --dias 365 2>&1 | tee logs/balanco_hidraulico.log
          else
            python scripts/atualizar_balanco_hidraulico_ren.py 2>&1 | tee logs/balanco_hidraulico.log
          fi

      # Corre mesmo que o script tenha saído com erro: se a validação falhou o
      # ficheiro ficou como estava e não há nada para comitar.
      - name: Fazer commit dos dados (com retry)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "💧 BOT: Atualizar balanço hidráulico (REN)"
          file_pattern: "data/producao/balanco_hidraulico_ren.csv"

      - name: Fazer upload do log como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-balanco-hidraulico
          path: logs/balanco_hidraulico.log
          retention-days: 30
