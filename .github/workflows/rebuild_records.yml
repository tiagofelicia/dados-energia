# Recalcula os recordes do zero, uma vez por mês.
#
# gerar_records_omie.py --full
# gerar_records_producao.py --full
#
# PORQUÊ ISTO EXISTE
# ------------------
# Os dois scripts correm em modo incremental nos workflows diários: leem o
# ficheiro do ano corrente e fundem-no com o records_*.json anterior. Isso é
# rápido, mas os anos já fechados nunca voltam a ser lidos — e as fontes
# publicam correções retroativas.
#
# O resultado media-se: o consumo de 2025 nos recordes estava 18 GWh acima do
# que o producao_historico_2025.csv diz, e a diferença só crescia. Os docstrings
# dos dois scripts já previam --full para "rebuilds periódicos", mas nenhum
# workflow o corria.
#
# Este corre. Dia 3 de cada mês, depois de a REN ter consolidado o mês anterior.
#
# Nota: o gerar_agregados.py e o gerar_intensidade_carbonica.py não precisam
# disto — recalculam sempre os 17 anos do zero, e por isso não acumulam desvio.

name: Rebuild dos Recordes

on:
  schedule:
    # Dia 3 de cada mês, 05:20 UTC — fora das janelas dos bots diários.
    - cron: '20 5 3 * *'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: commits-rebuild-records
  cancel-in-progress: false

jobs:
  rebuild:
    name: Recalcular recordes do zero
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache das dependências Python
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recalcular recordes OMIE
        run: |
          # set -o pipefail: sem isto o exit code passa a ser o do tee e uma
          # falha do script daria um step verde.
          set -o pipefail
          mkdir -p logs
          python scripts/gerar_records_omie.py --full 2>&1 | tee logs/rebuild.log

      - name: Recalcular recordes de produção
        run: |
          set -o pipefail
          python scripts/gerar_records_producao.py --full 2>&1 | tee -a logs/rebuild.log

      # Se o incremental não tiver acumulado desvio nesse mês, os ficheiros
      # ficam iguais e não há commit — é o resultado desejável.
      - name: Fazer commit dos recordes (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "🔄 BOT: Rebuild mensal dos recordes (--full)"
          file_pattern: "data/omie/records_omie.json data/producao/records_producao.json"

      - name: Fazer upload do log como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-rebuild-records
          path: logs/rebuild.log
          retention-days: 90
