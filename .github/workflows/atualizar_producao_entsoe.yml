# Atualiza a produção pública líquida europeia (ENTSO-E Transparency Platform).
#
# scripts/atualizar_producao_entsoe.py
#   -> data/producao/producao-entsoe/{cc}/{AAAA}-W{SS}.json + metadata.json
#
# Requer o secret ENTSOE_TOKEN (token da API da Transparency Platform).
#
# Horários (UTC):
#   - 0 */4 * * *   -> só PT+ES, ontem+hoje (--days 2), de 4 em 4 horas
#   - 0 14,22 * * * -> todos os países, semana ISO atual (--weeks 1), 2x/dia
#   - 0 6 * * 1     -> todos os países, 3 semanas ISO (--weeks 3), 1x/semana (segunda)
# A execução manual (workflow_dispatch) usa os inputs abaixo.

name: Atualizar Producao (ENTSO-E)

on:
  schedule:
    # ATENÇÃO: estes literais aparecem em mais dois sítios — no 'case' que
    # escolhe os argumentos e na expressão do timeout-minutes. Ao mudar um
    # cron, mudar nos três; um literal que deixe de bater não dá erro, apenas
    # cai silenciosamente no ramo por omissão.
    - cron: '0 */4 * * *'    # PT+ES, ontem+hoje — de 4 em 4 horas
    - cron: '0 14,22 * * *'  # todos, 1 semana — 2x/dia (14:00 e 22:00 UTC)
    - cron: '0 6 * * 1'      # todos, 3 semanas — segunda-feira 06:00 UTC

  workflow_dispatch:
    inputs:
      weeks:
        description: 'Nº de semanas ISO a atualizar (ignorado se backfill=true)'
        required: false
        default: '1'
      countries:
        description: 'Códigos de país separados por vírgula (vazio = todos). Ex.: pt,es'
        required: false
        default: ''
      backfill:
        description: 'Reconstruir tudo desde 2026-01-01'
        type: boolean
        required: false
        default: false

# Antecipar o default Node24 (silencia o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-producao-entsoe
  cancel-in-progress: false

jobs:
  update-producao-entsoe:
    name: Executar Atualização ENTSO-E (produção)
    runs-on: ubuntu-latest

    # Timeout por MODO, e não um valor único. Este workflow faz três trabalhos
    # de dimensão muito diferente com o mesmo job, e um timeout único ou mata o
    # trabalho semanal ou não protege as corridas de 4 em 4 horas:
    #
    #   0 */4      PT+ES, 2 dias       2 países     p50 ~5 min      60% das corridas
    #   0 14,22    todos, 1 semana     35 países    ~2-3 h          20%
    #   0 6 * * 1  todos, 3 semanas    35 países    327 min medido   1 vez/semana
    #
    # Os valores vêm do histórico real da API (execução do job, não tempo de
    # run — este workflow tem fila ~0, ao contrário do mapa de produção).
    # O p50 de 5 min e o máximo de 327 estão medidos; a faixa intermédia está
    # inferida pela proporção de trabalho, daí a margem mais folgada nela.
    #
    # A expressão: 'cond && valor || próximo' encadeado funciona como ternário
    # porque nenhum dos valores é 0 (que seria falsy). Sem schedule
    # (workflow_dispatch, incluindo backfill) cai no ramo mais generoso.
    timeout-minutes: ${{ github.event.schedule == '0 */4 * * *' && 40 || github.event.schedule == '0 14,22 * * *' && 240 || 350 }}
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        # entsoe_client.py usa requests; tzdata garante o zoneinfo em qualquer runner.
        run: python -m pip install --upgrade pip requests tzdata

      - name: Verificar secret ENTSOE_TOKEN
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo "::error::Secret ENTSOE_TOKEN não configurado em Settings → Secrets and variables → Actions deste repositório."
            exit 1
          fi

      - name: Determinar parâmetros (por horário ou input)
        id: params
        run: |
          SCHED="${{ github.event.schedule }}"
          # Defaults (execução manual / workflow_dispatch)
          WEEKS="${{ github.event.inputs.weeks }}"
          COUNTRIES="${{ github.event.inputs.countries }}"
          BACKFILL="${{ github.event.inputs.backfill }}"
          SCOPE="--weeks ${WEEKS:-1}"

          # Quando disparado por agendamento, o horário define o âmbito
          case "$SCHED" in
            "0 */4 * * *")   COUNTRIES="pt,es"; SCOPE="--days 2";  BACKFILL="false" ;;  # PT+ES, ontem+hoje, 4 em 4h
            "0 14,22 * * *") COUNTRIES="";      SCOPE="--weeks 1"; BACKFILL="false" ;;  # todos, semana atual, 2x/dia
            "0 6 * * 1")     COUNTRIES="";      SCOPE="--weeks 3"; BACKFILL="false" ;;  # todos, 3 semanas, segunda
          esac

          if [ "$BACKFILL" = "true" ]; then
            ARGS="--backfill"
          else
            ARGS="$SCOPE"
          fi
          if [ -n "$COUNTRIES" ]; then
            ARGS="$ARGS --countries $COUNTRIES"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Âmbito: ${COUNTRIES:-todos} · $ARGS"

      - name: Atualizar produção ENTSO-E
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/atualizar_producao_entsoe.py ${{ steps.params.outputs.args }}

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar producao ENTSO-E (${{ steps.params.outputs.args }})"
          file_pattern: "data/producao/producao-entsoe"
