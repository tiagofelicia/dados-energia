# Atualiza a produção pública líquida europeia (ENTSO-E Transparency Platform).
#
# scripts/atualizar_producao_entsoe.py
#   -> data/producao/producao-entsoe/{cc}/{AAAA}-W{SS}.json + metadata.json
#
# Requer o secret ENTSOE_TOKEN (token da API da Transparency Platform).
#
# Horários (UTC):
#   - 30 10 * * *   -> só PT+ES, ontem+hoje (--days 2), 1 vez por dia (reserva: o
#                      principal, de 3 em 3 horas, vem de fora — ver abaixo)
#   - 0 22 * * *    -> todos os países, semana ISO atual (--weeks 1), 1x/dia (reserva:
#                      o principal, 2x/dia, vem de fora)
#   A revisão semanal (todos os países, 3 semanas ISO, --weeks 3) já não tem cron: a 09
#   e a 16/11/2026 chegou aos 350 min e foi cancelada, sem commit (e o GitHub corta
#   qualquer job às 6 h). Faz-se de fora, à segunda de madrugada, em duas metades de
#   países no modo manual, ~3 h cada uma:
#     {"ref":"main","inputs":{"modo":"manual","weeks":"3","countries":"at,bg,cz,dk,es,fr,hr,ie,lt,me,no,pt,rs,si,al,xk,cy,md"}}
#     {"ref":"main","inputs":{"modo":"manual","weeks":"3","countries":"be,ch,de,ee,fi,gr,hu,it,lv,nl,pl,ro,se,sk,mk,ba,ge"}}
#   Ao acrescentar um país ao COUNTRIES do script, acrescentá-lo também a uma das metades.
# A execução manual (workflow_dispatch) usa os inputs abaixo. Com o input 'modo', a
# execução manual faz exatamente o mesmo que um dos três crons — é assim que um
# agendador de fora do GitHub dispara este workflow pela API (os crons do GitHub
# chegam com horas de atraso e, os de 3 em 3 horas, muitas vezes nem chegavam):
#   POST https://api.github.com/repos/tiagofelicia/dados-energia/actions/workflows/atualizar_producao_entsoe.yml/dispatches
#   {"ref":"main","inputs":{"modo":"pt-es"}}       (ou "semana", ou "3-semanas")
# Um 'modo' que não esteja na lista é recusado pela API (422), em vez de cair
# calado no ramo por omissão.

name: Atualizar Producao (ENTSO-E)

on:
  schedule:
    # ATENÇÃO: estes literais aparecem em mais dois sítios — no 'case' que
    # escolhe os argumentos e na expressão do timeout-minutes. Ao mudar um
    # cron, mudar nos três; um literal que deixe de bater não dá erro, apenas
    # cai silenciosamente no ramo por omissão.
    - cron: '30 10 * * *'    # PT+ES, ontem+hoje — 1x/dia (reserva do disparo de fora)
    - cron: '0 22 * * *'     # todos, 1 semana — 1x/dia (reserva do disparo de fora)

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo: manual (usa os campos abaixo), pt-es (PT+ES, ontem+hoje, o de 3 em 3 h), semana (todos, 1 semana) ou 3-semanas (todos, 3 semanas: já passa das 6 h e é cancelada; usar 2 metades de países no modo manual)'
        type: choice
        options:
          - manual
          - pt-es
          - semana
          - 3-semanas
        required: false
        default: manual
      weeks:
        description: 'Nº de semanas ISO a atualizar (só no modo manual; ignorado se backfill=true)'
        required: false
        default: '1'
      countries:
        description: 'Códigos de país separados por vírgula (vazio = todos; só no modo manual). Ex.: pt,es'
        required: false
        default: ''
      backfill:
        description: 'Reconstruir tudo desde 2026-01-01 (só no modo manual)'
        type: boolean
        required: false
        default: false

# Antecipar o default Node24 (silencia o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-producao-entsoe
  cancel-in-progress: false

jobs:
  update-producao-entsoe:
    name: Executar Atualização ENTSO-E (produção)
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04

    # Timeout por MODO, e não um valor único. Este workflow faz três trabalhos
    # de dimensão muito diferente com o mesmo job, e um timeout único ou mata o
    # trabalho semanal ou não protege as corridas curtas (PT+ES):
    #
    #   30 10      PT+ES, 2 dias       2 países     p50 ~5 min      a maioria (com o modo pt-es)
    #   0 22       todos, 1 semana     35 países    ~2-3 h          2x/dia (com o modo semana)
    #   (fora)     metade, 3 semanas   17-18 países ~3 h            à segunda (modo manual)
    #   3-semanas  todos, 3 semanas    35 países    >350 min         cancelada a 09 e 16/11/2026
    #
    # Disparado de fora com o input 'modo', vale o timeout do cron equivalente
    # (pt-es = 40, semana = 240, 3-semanas = 350).
    #
    # Os valores vêm do histórico real da API (execução do job, não tempo de
    # run — este workflow tem fila ~0, ao contrário do mapa de produção).
    # O p50 de 5 min e os 327 min das 3 semanas (outubro de 2026; em novembro já
    # passavam dos 350) estão medidos; a faixa intermédia está
    # inferida pela proporção de trabalho, daí a margem mais folgada nela.
    #
    # A expressão: 'cond && valor || próximo' encadeado funciona como ternário
    # porque nenhum dos valores é 0 (que seria falsy). Sem schedule
    # nem modo (workflow_dispatch manual, incluindo backfill) cai no ramo mais
    # generoso. Fora do workflow_dispatch, github.event.inputs não existe e as
    # comparações com o modo dão falso.
    timeout-minutes: ${{ (github.event.schedule == '30 10 * * *' || github.event.inputs.modo == 'pt-es') && 40 || (github.event.schedule == '0 22 * * *' || github.event.inputs.modo == 'semana') && 240 || 350 }}
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        # entsoe_client.py usa requests; tzdata garante o zoneinfo em qualquer runner.
        run: python -m pip install --upgrade pip requests tzdata

      - name: Verificar secret ENTSOE_TOKEN
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo "::error::Secret ENTSOE_TOKEN não configurado em Settings → Secrets and variables → Actions deste repositório."
            exit 1
          fi

      - name: Determinar parâmetros (por horário ou input)
        id: params
        run: |
          SCHED="${{ github.event.schedule }}"
          # Defaults (execução manual / workflow_dispatch)
          WEEKS="${{ github.event.inputs.weeks }}"
          COUNTRIES="${{ github.event.inputs.countries }}"
          BACKFILL="${{ github.event.inputs.backfill }}"
          MODO="${{ github.event.inputs.modo }}"
          SCOPE="--weeks ${WEEKS:-1}"

          # Quando disparado por agendamento, o horário define o modo
          case "$SCHED" in
            "30 10 * * *")   MODO="pt-es" ;;      # PT+ES, ontem+hoje, 1x/dia (reserva)
            "0 22 * * *")    MODO="semana" ;;     # todos, semana atual, 1x/dia (reserva)
          esac

          # O modo (do cron ou do input) define o âmbito; 'manual' ou vazio usa os inputs
          case "$MODO" in
            pt-es)     COUNTRIES="pt,es"; SCOPE="--days 2";  BACKFILL="false" ;;
            semana)    COUNTRIES="";      SCOPE="--weeks 1"; BACKFILL="false" ;;
            3-semanas) COUNTRIES="";      SCOPE="--weeks 3"; BACKFILL="false" ;;
          esac

          if [ "$BACKFILL" = "true" ]; then
            ARGS="--backfill"
          else
            ARGS="$SCOPE"
          fi
          if [ -n "$COUNTRIES" ]; then
            ARGS="$ARGS --countries $COUNTRIES"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Modo: ${MODO:-manual} · âmbito: ${COUNTRIES:-todos} · $ARGS"

      - name: Atualizar produção ENTSO-E
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/atualizar_producao_entsoe.py ${{ steps.params.outputs.args }}

      # Portugal: o saldo importador da REN ao lado dos fluxos da ENTSO-E (campo cross_border_ren dos
      # ficheiros de PT), porque desde julho de 2026 os fluxos físicos PT–ES da ENTSO-E ficam abaixo do
      # saldo da REN. Só lê os CSV da REN do repositório; sem eles, avisa e não mexe em nada.
      - name: Acrescentar o saldo da REN (Portugal)
        run: python scripts/acrescentar_saldo_ren_pt.py

      # Preço capturado solar e eólico por zona (preço pesado pela produção), a partir
      # da produção acabada de atualizar e dos preços de data/mapas/precos_qh
      - name: Gerar preço capturado
        run: python scripts/gerar_captura_precos.py

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar producao ENTSO-E (${{ steps.params.outputs.args }})"
          file_pattern: "data/producao/producao-entsoe data/mapas/captura"
