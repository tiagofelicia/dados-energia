# Pré-calcula as séries derivadas dos dados que já estão no repositório.
#
# gerar_agregados.py
#   → data/agregados/omie_{diario,mensal,anual}.csv
#   → data/agregados/producao_{diario,mensal,anual}.csv
#   → data/agregados/metadata.json
#
# gerar_intensidade_carbonica.py
#   → data/emissoes/intensidade_{diaria,mensal,anual}.csv
#   → data/emissoes/intensidade_perfil_horario.csv
#   → data/emissoes/fatores_emissao.csv
#   Os dois derivam de data/producao/ e correm 1x/dia — partilham o workflow.
#
# gerar_erc_resumo.py
#   → data/agregados/erc_resumo.json (resumo + previsão própria, para a página /erc)
#   → data/agregados/erc_diario/AAAA.json (por dia e hora; a página calcula daqui
#     qualquer período escolhido)
#   Deriva de data/erc/isp/ (enviado 2x/dia pela tarefa num PC em Portugal) e
#   da folha OMIE_PERDAS_CICLOS do simulador (períodos horários e perdas).
#   → data/agregados/erc_omie/AAAA-MM.json (OMIE PT, ERC e perdas por quarto de
#     hora, para a página escolher um dia; só reescreve os meses que mudam)
#   → data/agregados/erc_tipo/AAAA.json (€ e quantidade de cada tipo de encargo
#     por dia de mercado, para o bloco "De onde vem o ERC"; deriva de data/erc/tipo/)
#   ~1 min: mede o erro da previsão do ERC a partir de ~70 origens no último ano.
#
# gerar_servicos_sistema.py (depois do anterior: lê-lhe as constantes)
#   → data/agregados/servicos_sistema/AAAA-MM.json (reservas, desvios, restrições
#     e redução de geração por hora, para a página /servicos-sistema) e o
#     metadata.json com os indicadores e o OMIE PT médio de cada dia
#
# gerar_quotas_agentes.py
#   → data/agregados/agentes/AAAA.json (consumo e ERC de cada agente de mercado
#     por dia, e por hora em cada mês, para a página /quotas-agentes) e o
#     metadata.json com os nomes (de data/erc/erc_agentes.csv) e as cores
#
# Não recolhe nada de fora: deriva dos CSV que já estão no repositório. Por isso
# corre DEPOIS dos workflows que os escrevem — o OMIE fecha às 18:00 UTC e a
# produção REN às 20:15, daí as 21:30.
#
# Uma vez por dia chega: são séries históricas para consulta, não dados
# intra-diários. O script recalcula sempre os 17 anos do zero (~30 s), o que o
# torna imune ao desvio que os modos incrementais acumulam.

name: Gerar Agregados e Emissões

on:
  schedule:
    - cron: '30 21 * * *'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: commits-agregados
  cancel-in-progress: false

jobs:
  gerar-agregados:
    name: Pré-calcular agregados e intensidade carbónica
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache das dependências Python
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar agregados
        run: |
          # set -o pipefail: sem isto o exit code passa a ser o do tee e uma
          # falha do script daria um step verde.
          set -o pipefail
          mkdir -p logs
          python scripts/gerar_agregados.py 2>&1 | tee logs/agregados.log

      - name: Gerar intensidade carbónica
        run: |
          set -o pipefail
          python scripts/gerar_intensidade_carbonica.py 2>&1 | tee -a logs/agregados.log

      - name: Gerar resumo do ERC
        run: |
          set -o pipefail
          python scripts/gerar_erc_resumo.py 2>&1 | tee -a logs/agregados.log

      - name: Gerar serviços de sistema
        run: |
          set -o pipefail
          python scripts/gerar_servicos_sistema.py 2>&1 | tee -a logs/agregados.log

      - name: Gerar quotas por agente
        run: |
          set -o pipefail
          python scripts/gerar_quotas_agentes.py 2>&1 | tee -a logs/agregados.log

      # Os scripts não reescrevem os ficheiros que não mudaram, por isso a action
      # não deteta alterações e não commita — nenhum commit vazio.
      - name: Fazer commit dos derivados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "📊 BOT: Atualizar agregados + intensidade carbónica + ERC + serviços de sistema + agentes"
          file_pattern: "data/agregados/* data/agregados/erc_diario/* data/agregados/erc_omie/* data/agregados/erc_tipo/* data/agregados/servicos_sistema/* data/agregados/agentes/* data/emissoes/*"

      - name: Fazer upload do log como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-agregados
          path: logs/agregados.log
          retention-days: 30
