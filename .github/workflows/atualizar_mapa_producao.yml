# Atualiza o mix de produção elétrica por país europeu (Energy-Charts).
#
# atualizar_mapa_producao.py → data/mapas/producao/AAAA-MM.json + metadata.json


name: Atualizar Mapa de Producao

on:
  schedule:
    # Todos os dias às 14:30 e 23:00 UTC
    - cron: '30 14 * * *'
    - cron: '00 23 * * *'

  workflow_dispatch: # Permite execução manual

# Antecipar o default de 2026-06-16 (e silenciar o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-mapa-producao
  cancel-in-progress: false

jobs:
  update-production-data:
    name: Executar Atualização Energy-Charts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar mix de produção europeu
        run: python scripts/atualizar_mapa_producao.py

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar dados mapa de producao europeu"
          file_pattern: "data/mapas/producao/*.json"
