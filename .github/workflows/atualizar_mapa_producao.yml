# Atualiza o mix de produção elétrica por país europeu (Energy-Charts).
#
# atualizar_mapa_producao.py → data/mapas/producao/AAAA-MM.json + metadata.json
#
# A corrida normal pede os últimos 7 dias e o dia seguinte, para todos os países. Na
# execução manual (Run workflow), «inicio» e «paises» recolhem de novo só alguns países
# desde uma data (--start/--countries): o script carrega os ficheiros mensais e só
# substitui os países pedidos. Serve para corrigir o histórico depois de mudar o
# TYPE_MAP, ou para repor um país cuja fonte esteve parada mais de 7 dias (a Dinamarca
# não tem dados na Energy-Charts desde 06/11/2026).


name: Atualizar Mapa de Producao

on:
  schedule:
    # Os horários principais vêm de fora do GitHub: um agendador externo dispara este
    # workflow pela API (workflow_dispatch), 3 vezes por dia, na hora de Lisboa. Uma
    # corrida demora ~25 min (28 países), por isso não convém correr muito mais vezes.
    # Desde agosto de 2026 o GitHub cria as corridas agendadas deste repositório 4 a 10
    # horas depois da hora marcada, por isso o cron abaixo é só reserva, 1 vez por dia.
    # Chega: cada corrida volta a pedir os últimos 7 dias e o dia seguinte.
    - cron: '00 23 * * *'

  workflow_dispatch: # Permite execução manual
    inputs:
      inicio:
        description: 'Recolher de novo desde esta data (AAAA-MM-DD). Vazio = corrida normal (últimos 7 dias e amanhã)'
        type: string
        required: false
        default: ''
      paises:
        description: 'Só estes países, separados por espaço ou vírgula (ex.: ee fi). Vazio = todos'
        type: string
        required: false
        default: ''

# Antecipar o default de 2026-06-16 (e silenciar o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-mapa-producao
  cancel-in-progress: false

jobs:
  update-production-data:
    name: Executar Atualização Energy-Charts
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar mix de produção europeu
        # Os inputs entram por variáveis de ambiente (e não diretamente no script)
        # e são validados antes de chegarem à linha de comandos.
        env:
          INICIO: ${{ github.event.inputs.inicio }}
          PAISES: ${{ github.event.inputs.paises }}
        run: |
          ARGS=()
          RE_DATA='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          RE_PAISES='^[A-Za-z]{2}([ ,]+[A-Za-z]{2})*[ ,]*$'
          if [ -n "$INICIO" ]; then
            if ! [[ "$INICIO" =~ $RE_DATA ]]; then
              echo "::error::inicio inválido: '$INICIO' (formato AAAA-MM-DD)"; exit 1
            fi
            ARGS+=(--start "$INICIO")
          fi
          if [ -n "$PAISES" ]; then
            if ! [[ "$PAISES" =~ $RE_PAISES ]]; then
              echo "::error::paises inválido: '$PAISES' (ex.: ee fi)"; exit 1
            fi
            ARGS+=(--countries $(echo "$PAISES" | tr ',' ' '))
          fi
          echo "Argumentos: ${ARGS[*]:-(corrida normal)}"
          python scripts/atualizar_mapa_producao.py "${ARGS[@]}"

      # Consumo diário por país (real ou previsto), tirado dos ficheiros acabados
      # de escrever: pesa a média europeia do europe-prices.html
      - name: Gerar consumo por país
        run: python scripts/gerar_consumo_paises.py

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar dados mapa de producao europeu"
          file_pattern: "data/mapas/producao/*.json data/mapas/consumo_paises.json"
