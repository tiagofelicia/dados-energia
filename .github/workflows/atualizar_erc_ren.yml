# Publica os Encargos de Regulação Imputados ao Consumo (ERC) da REN, por
# período de 15 minutos, nas três vistas do SIME (mercado.ren.pt):
#
# atualizar_erc_ren.py
#   → data/erc/isp/erc_isp_AAAA-MM.csv     total, componentes e consumo de mercado
#   → data/erc/brp/erc_brp_AAAA-MM.csv     repartição por agente (BRP)
#   → data/erc/tipo/erc_tipo_AAAA-MM.csv   repartição por tipo de encargo
#   → data/erc/erc_tipo_codigos.csv        dicionário dos códigos do tipo
#
# Não precisa de secrets: a chave da API é a que as páginas públicas da REN
# enviam (ver o cabeçalho do script). Se a REN a mudar, pode ser passada num
# secret REN_API_KEY sem mexer no código — o step já o lê.
#
# Primeira corrida: lançar à mão com backfill=true (série desde 14/03/2024,
# ~150 MB, 15-30 min). Sem isso o script também faz o backfill sozinho quando
# não encontra ficheiros, mas com o timeout normal.

name: Atualizar ERC (REN)

on:
  schedule:
    # A REN publica com 1 a 2 dias de atraso, sem hora certa. Duas corridas
    # chegam: o script é idempotente e uma corrida sem novidades não comita.
    - cron: '40 9 * * *'
    - cron: '40 17 * * *'

  workflow_dispatch:
    inputs:
      backfill:
        description: 'Reconstruir a série completa desde 14/03/2024'
        type: boolean
        required: false
        default: false

# Antecipar o default Node24 (silencia o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo próprio: as corridas contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry. Este grupo só serve para o workflow não se
# sobrepor a si mesmo.
concurrency:
  group: commits-erc
  cancel-in-progress: false

jobs:
  atualizar-erc:
    name: Recolher ERC da REN
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04
    # 60 e não 15 por causa do backfill (~2 800 pedidos). O incremental são ~25
    # pedidos e acaba em menos de um minuto.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache das dependências Python
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar ERC
        env:
          # Vazio enquanto o secret não existir; o script usa então a chave
          # que traz de origem.
          REN_API_KEY: ${{ secrets.REN_API_KEY }}
        run: |
          # set -o pipefail: sem isto o exit code passa a ser o do tee e uma
          # falha do script daria um step verde.
          set -o pipefail
          mkdir -p logs
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            ARGS="--backfill"
          fi
          python -u scripts/atualizar_erc_ren.py $ARGS 2>&1 | tee logs/erc_ren.log

      # O script não reescreve os ficheiros quando nada mudou, por isso a action
      # não deteta alterações e não commita — nenhum commit vazio.
      - name: Fazer commit dos datasets (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "⚖️ BOT: Atualizar ERC (REN)"
          file_pattern: "data/erc"

      - name: Fazer upload do log como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-erc-ren
          path: logs/erc_ren.log
          retention-days: 30
