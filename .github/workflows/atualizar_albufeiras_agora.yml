# O nível «de agora» das albufeiras: os valores de hora a hora das últimas 48 horas que a
# APA publica no InfoÁgua (volume armazenado em %, cota e caudais afluente e efluente),
# para a secção «Agora» das páginas /albufeira/<nome> do site. Todas as estações de
# albufeira do InfoÁgua (62 a 21/11/2026, 9 delas em Espanha, junto à fronteira), lidas
# da página de pesquisa do InfoÁgua em cada corrida.
#
# scripts/atualizar_albufeiras_agora.py
#   -> data/producao/albufeiras_agora.json                         (as últimas 48 h)
#   -> data/producao/albufeiras-horario/albufeiras_horario_AAAA.csv (o histórico; o
#      InfoÁgua só guarda 48 h, por isso cada corrida junta o que vier ao que já lá está)
#
# Ao contrário do SNIRH (recolhido num PC em Portugal), o InfoÁgua aceita ligações de
# fora de Portugal (verificado a 21/11/2026 a partir da Alemanha, de Espanha e dos EUA).
# Se um dia deixar de aceitar, a corrida falha sem tocar nos ficheiros.
#
# De hora a hora, aos 40 minutos: a APA publica a hora cheia com 30 a 90 minutos de
# atraso. Com o atraso habitual dos crons do GitHub, o «Agora» fica com 1 a 3 horas.
# Se o agendamento não arrancar depois de um envio (aconteceu com o primeiro, a 21/11/2026),
# voltar a subir este ficheiro com uma alteração qualquer faz o GitHub registá-lo de novo.
# Uma corrida demora ~2 min (a lista e 62 páginas, com 1 s entre pedidos).
#
# Não está no workflow_run do gerar_hoje.yml de propósito: refazer o manifesto 24 vezes
# por dia não acrescenta nada; os outros bots refazem-no várias vezes por dia, e a
# tolerância do manifesto é de 1 dia.

name: Atualizar Albufeiras Agora (APA)

on:
  schedule:
    - cron: '40 * * * *'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo próprio: só impede que este workflow se sobreponha a si mesmo; as corridas
# contra os outros bots resolvem-se no retry+rebase da commit-with-retry.
concurrency:
  group: commits-albufeiras-agora
  cancel-in-progress: false

jobs:
  atualizar-albufeiras-agora:
    name: Recolher os valores de hora a hora do InfoÁgua
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: python -m pip install --upgrade pip tzdata

      - name: Recolher o InfoÁgua
        run: python scripts/atualizar_albufeiras_agora.py

      - name: Fazer commit dos dados (com retry)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "💧 BOT: Atualizar albufeiras agora (APA)"
          file_pattern: "data/producao/albufeiras_agora.json data/producao/albufeiras-horario/*.csv"
