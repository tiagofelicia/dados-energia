# Atualiza os preços day-ahead europeus (ENTSO-E Transparency Platform).
#
# atualizar_mapa_precos_entsoe.py → data/mapas/precos_qh/AAAA-MM.json + metadata.json
#
# Requer o secret ENTSOE_TOKEN (token da API da Transparency Platform).

name: Atualizar Mapa de Precos (ENTSO-E)

on:
  schedule:
    # Todos os dias às 15:00 UTC
    - cron: '0 15 * * *'

  workflow_dispatch: # Permite execução manual
    inputs:
      refazer:
        description: "Refazer dias já gravados: vazio = atualização normal; 'mudancas-hora' = os dias de mudança de hora desde 2018; 'lacunas' = voltar a pedir os dias em falta e incompletos de todas as zonas; ou datas AAAA-MM-DD separadas por espaços"
        required: false
        default: ""
      corrigir_moeda:
        description: "Converter para euros os preços de RO, PL e BG gravados na moeda local (corre uma vez; ver scripts/corrigir_moeda_precos_qh.py)"
        type: boolean
        default: false
      simular:
        description: "No modo refazer, lacunas ou corrigir moeda: só mostrar o resultado no log, sem gravar"
        type: boolean
        default: true

# Antecipar o default de 2026-06-16 (e silenciar o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-mapa-precos
  cancel-in-progress: false

jobs:
  update-map-data:
    name: Executar Atualização ENTSO-E
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04
    # 120 e nao 60 por causa do modo 'refazer': os dias de mudanca de hora desde
    # 2018 sao ~800 pedidos (17 dias x 48 zonas). As corridas diarias levam 5-20 min.
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar secret ENTSOE_TOKEN
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo "::error::Secret ENTSOE_TOKEN não configurado em Settings → Secrets and variables → Actions deste repositório."
            exit 1
          fi

      - name: Atualizar preços ENTSO-E
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          REFAZER: ${{ inputs.refazer }}
          SIMULAR: ${{ inputs.simular }}
          CORRIGIR_MOEDA: ${{ inputs.corrigir_moeda }}
        run: |
          # Nas corridas agendadas 'refazer' vem vazio. O que vem do formulário só
          # chega à linha de comandos se for 'mudancas-hora' ou uma lista de datas.
          if [ "$CORRIGIR_MOEDA" = "true" ]; then
            ARGS=()
            if [ "$SIMULAR" = "true" ]; then ARGS+=(--simular); fi
            python scripts/corrigir_moeda_precos_qh.py "${ARGS[@]}"
          elif [ -z "$REFAZER" ]; then
            python scripts/atualizar_mapa_precos_entsoe.py
          else
            ARGS=()
            if [ "$REFAZER" = "mudancas-hora" ]; then
              ARGS+=(--mudancas-hora)
            elif [ "$REFAZER" = "lacunas" ]; then
              ARGS+=(--preencher-lacunas)
            elif [[ "$REFAZER" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]]; then
              read -r -a DIAS <<< "$REFAZER"
              ARGS+=(--refazer-dias "${DIAS[@]}")
            else
              echo "::error::'refazer' tem de ficar vazio, ser 'mudancas-hora', 'lacunas' ou datas AAAA-MM-DD separadas por espaços."
              exit 1
            fi
            if [ "$SIMULAR" = "true" ]; then ARGS+=(--simular); fi
            python scripts/atualizar_mapa_precos_entsoe.py "${ARGS[@]}"
          fi

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualizar dados mapa de precos (ENTSO-E)"
          file_pattern: "data/mapas/precos_qh/*.json"
