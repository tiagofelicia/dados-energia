# Atualiza os dados de produção elétrica de Portugal (REN Data Hub).
#
# atualizar_producao_REN.py       → data/producao/producao_dados_atuais.csv
# atualizar_producao_bombagem.py  → data/producao/producao_bombagem_diaria.csv
#                                   (últimos 14 dias; ao domingo, os últimos 365)
# gerar_records_producao.py       → data/producao/records_producao.json
#                                   (incremental; do zero na revisão de domingo)

name: Atualizar Dados de Produção (REN)

on:
  schedule:
    # minuto 15, a cada 3 horas
    - cron: '15 */3 * * *'
    # domingo, 04:45 UTC: revisão da bombagem dos últimos 365 dias (ver o passo da bombagem)
    - cron: '45 4 * * 0'

  workflow_dispatch: # Permite execução manual
    inputs:
      revisao:
        description: 'Revisão: voltar a pedir à REN a bombagem dos últimos 365 dias e recalcular os recordes do zero'
        type: boolean
        default: false

# Antecipar o default de 2026-06-16 (e silenciar o aviso de deprecação Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grupo PRÓPRIO deste workflow: impede apenas que ele se sobreponha a si
# mesmo. As corridas de push contra os outros bots são resolvidas pelo
# retry+rebase da commit-with-retry — os bots escrevem em pastas disjuntas,
# por isso o rebase é trivial.
#
# Até aqui os seis workflows partilhavam um grupo único, o que os serializava:
# medimos filas de mais de 100 minutos (24 min de trabalho, 104 à espera). Pior,
# com um grupo cheio o GitHub mantém só UMA corrida pendente — uma terceira a
# chegar cancelava a que estava em fila, sem erro e sem email.
concurrency:
  group: commits-producao-ren
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: Executar Atualização REN
    # Label explícita: entre 19/10 e 19/11/2026 o ubuntu-latest migra de 24.04
    # para 26.04, e durante essas semanas cada corrida podia calhar num runner
    # ou no outro sem aviso (actions/runner-images#14748). A imagem nova foi
    # testada primeiro no atualizar_tarifarios_gas.yml, que é o único com Chrome
    # e Selenium; ver lá a explicação completa. Marcha-atrás: 'ubuntu-24.04'.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache das dependências Python
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar produção (REN)
        run: python scripts/atualizar_producao_REN.py

      # A REN revê a «Produção por Bombagem» diária semanas depois de a publicar (em ago–out/2026, +6 % a
      # +18 % por mês face ao provisório), e as corridas normais só voltam a pedir os últimos 14 dias. Na
      # corrida de domingo (ou à mão, com «revisao»), pedem-se os últimos 365 e os recordes são recalculados
      # do zero, porque o modo incremental não desfaz um recorde que a revisão tenha baixado.
      - name: Atualizar produção por bombagem (diária)
        run: |
          if [ "${{ github.event.schedule }}" = "45 4 * * 0" ] || [ "${{ inputs.revisao }}" = "true" ]; then
            python scripts/atualizar_producao_bombagem.py --dias 365
          else
            python scripts/atualizar_producao_bombagem.py
          fi

      - name: Atualizar recordes de produção (incremental; do zero na revisão)
        run: |
          if [ "${{ github.event.schedule }}" = "45 4 * * 0" ] || [ "${{ inputs.revisao }}" = "true" ]; then
            python scripts/gerar_records_producao.py --full
          else
            python scripts/gerar_records_producao.py
          fi

      - name: Fazer commit dos dados atualizados (com retry)
        uses: ./.github/actions/commit-with-retry
        with:
          commit_message: "BOT: Atualização automática dos dados de produção REN"
          file_pattern: "data/producao/producao_dados_atuais.csv data/producao/producao_bombagem_diaria.csv data/producao/records_producao.json"
